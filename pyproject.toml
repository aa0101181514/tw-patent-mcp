[project]
name = "tw-patent-mcp"
version = "0.1.1"
description = "MCP server for patent search via Taiwan IPO GPSS and EPO Open Patent Services: bibliographic search across 23 databases, INPADOC legal status, patent families, full text, and original publication PDFs. Bring your own API keys."
readme = "README.md"
license = { text = "Elastic-2.0" }
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Dr.Legal (dr-legal.com.tw)" }]
keywords = ["mcp", "patent", "taiwan", "tipo", "gpss", "epo", "ops", "prior-art", "inpadoc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Natural Language :: Chinese (Traditional)",
]
dependencies = [
    "httpx>=0.27",
    "mcp>=2.3.0",
    "pypdf>=5.0",
]

[project.urls]
Homepage = "https://dr-legal.com.tw"
Source = "https://github.com/aa0101181514/tw-patent-mcp"
Issues = "https://github.com/aa0101181514/tw-patent-mcp/issues"

[project.scripts]
tw-patent-mcp = "tw_patent_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tw_patent_mcp"]

[tool.hatch.build.targets.sdist]
include = ["/tw_patent_mcp", "/tests", "/README.md", "/README.en.md", "/LICENSE", "/.env.example"]

[dependency-groups]
dev = [
    "pytest>=8",
]
